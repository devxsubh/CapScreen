<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">What CapScreen does, and who does each part</title>
<desc id="desc">Code finds and scores the matches, a model only maps columns and writes text, and a person makes every decision.</desc>
<defs><style>
.bg{fill:#f8fafc}
.t{fill:#0f172a}
.h{font-size:20px;font-weight:700}
.b{font-size:14px;font-weight:700}
.m{font-size:13px}
.s{font-size:12px}
.xs{font-size:11px}
.mut{fill:#475569}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bx{stroke-width:1.5}
.dash{stroke-dasharray:6 4}
.code{fill:#eff6ff;stroke:#3b82f6}
.ai{fill:#f5f3ff;stroke:#8b5cf6}
.prompt{fill:#fffbeb;stroke:#d97706}
.data{fill:#f0fdf4;stroke:#16a34a}
.ext{fill:#fff7ed;stroke:#ea580c}
.ui{fill:#ffffff;stroke:#94a3b8}
.warn{fill:#fef2f2;stroke:#ef4444}
.hl{fill:#fde68a;opacity:.45}
.zone{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:8 6}
.zonet{fill:#64748b;font-size:12px;font-weight:700;letter-spacing:.06em}
.ln{fill:none;stroke:#475569;stroke-width:1.6}
.lnd{stroke-dasharray:6 5}
.lno{fill:none;stroke:#ea580c;stroke-width:1.6;stroke-dasharray:6 5}
.ahf{fill:#475569}
.aho{fill:#ea580c}
.life{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:4 4}
.lbl{fill:#475569;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}
.dot{fill:#475569}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ahf" d="M0 0L10 5L0 10z"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="aho" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="1100" height="470"/>
<text class="t h" x="30" y="40">What CapScreen does, and who does each part</text>
<text class="t m mut" x="30" y="62">Code finds and scores the matches, a model only maps columns and writes text, and a person makes every decision.</text>
<rect class="zone" x="30" y="86" width="1040" height="90" rx="14"/><text class="zonet" x="46" y="108">PERSON</text>
<rect class="zone" x="30" y="188" width="1040" height="104" rx="14"/><text class="zonet" x="46" y="210">CODE</text>
<rect class="zone" x="30" y="304" width="1040" height="90" rx="14"/><text class="zonet" x="46" y="326">MODEL</text>
<rect class="ui bx" x="150" y="106" width="130" height="52" rx="9"/><text class="t b" x="215" y="127" text-anchor="middle">Upload</text><text class="t s mut" x="215" y="147" text-anchor="middle">cap table CSV</text>
<rect class="code bx" x="300" y="206" width="130" height="70" rx="9"/><text class="t b" x="365" y="236" text-anchor="middle">Parse CSV</text><text class="t s mut" x="365" y="256" text-anchor="middle">strict · aliases</text>
<rect class="code bx" x="450" y="206" width="130" height="70" rx="9"/><text class="t b" x="515" y="236" text-anchor="middle">Build graph</text><text class="t s mut" x="515" y="256" text-anchor="middle">chains to UBOs</text>
<rect class="code bx" x="600" y="206" width="130" height="70" rx="9"/><text class="t b" x="665" y="228" text-anchor="middle">Match names</text><text class="t s mut" x="665" y="248" text-anchor="middle">Watchman, every</text><text class="t s mut" x="665" y="264" text-anchor="middle">node in parallel</text>
<rect class="code bx" x="750" y="206" width="130" height="70" rx="9"/><text class="t b" x="815" y="228" text-anchor="middle">Tier + rules</text><text class="t s mut" x="815" y="248" text-anchor="middle">score bands</text><text class="t s mut" x="815" y="264" text-anchor="middle">50% · 25% rules</text>
<rect class="ai bx dash" x="300" y="322" width="130" height="56" rx="9"/><text class="t b" x="365" y="345" text-anchor="middle">Map columns</text><text class="t s mut" x="365" y="365" text-anchor="middle">only if code can't</text>
<rect class="ai bx" x="750" y="322" width="130" height="56" rx="9"/><text class="t b" x="815" y="345" text-anchor="middle">Write notes</text><text class="t s mut" x="815" y="365" text-anchor="middle">who · why · next</text>
<rect class="ai bx" x="900" y="322" width="150" height="56" rx="9"/><text class="t b" x="975" y="345" text-anchor="middle">Chat assistant</text><text class="t s mut" x="975" y="365" text-anchor="middle">explains, drafts</text>
<rect class="ui bx" x="900" y="106" width="150" height="52" rx="9"/><text class="t b" x="975" y="127" text-anchor="middle">Review + decide</text><text class="t s mut" x="975" y="147" text-anchor="middle">graph, table, cards</text>
<path class="ln" d="M215 158 L215 241 L300 241" marker-end="url(#ah)"/>
<path class="ln" d="M430 241 L450 241" marker-end="url(#ah)"/>
<path class="ln" d="M580 241 L600 241" marker-end="url(#ah)"/>
<path class="ln" d="M730 241 L750 241" marker-end="url(#ah)"/>
<path class="ln lnd" d="M365 276 L365 322" marker-end="url(#ah)" marker-start="url(#ah)"/>
<path class="ln" d="M815 276 L815 322" marker-end="url(#ah)"/>
<path class="ln" d="M880 226 L950 226 L950 158" marker-end="url(#ah)"/>
<path class="ln" d="M1000 322 L1000 158" marker-end="url(#ah)"/>
<text class="t s mut" x="30" y="428" text-anchor="start">It never decides guilt: it narrows the review set for a compliance officer. If Watchman is down, screening fails instead of</text>
<text class="t s mut" x="30" y="446" text-anchor="start">returning 'clear'. Everything stays on the user's computer unless they assign a cloud model.</text>
</svg>
