<rect class="ext bx dash" x="360" y="410" width="410" height="36" rx="9"/><text class="t s mut" x="565" y="432" text-anchor="middle">sign-in gate, if needed (browser + PKCE)</text>
<path class="ln lnd" d="M785 92 L785 456"/>
