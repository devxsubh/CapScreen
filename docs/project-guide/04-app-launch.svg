.lbl{fill:#475569;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}
.dot{fill:#475569}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ahf" d="M0 0L10 5L0 10z"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="aho" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="1100" height="520"/>
<text class="t h" x="30" y="40">App launch (desktop/src/main.ts)</text>
<text class="t m mut" x="30" y="62">Boot and sign-in run at the same time; the app opens when both are done.</text>
<text class="zonet" x="30" y="123" text-anchor="start">WINDOW</text>
<text class="zonet" x="30" y="173" text-anchor="start">KEYCHAIN</text>
<text class="zonet" x="30" y="223" text-anchor="start">WATCHMAN</text>
<text class="zonet" x="30" y="273" text-anchor="start">BACKEND</text>
<text class="zonet" x="30" y="323" text-anchor="start">UI</text>
<text class="zonet" x="30" y="373" text-anchor="start">SHELL</text>
<text class="zonet" x="30" y="433" text-anchor="start">SIGN-IN</text>
<rect class="ui bx dash" x="150" y="100" width="620" height="36" rx="9"/><text class="t s mut" x="460" y="122" text-anchor="middle">splash page</text>
<rect class="ui bx" x="800" y="100" width="140" height="36" rx="9"/><text class="t s mut" x="870" y="122" text-anchor="middle">capscreen://app/</text>
<rect class="ui bx" x="955" y="100" width="115" height="36" rx="9"/><text class="t s mut" x="1012.5" y="122" text-anchor="middle">→ /assistant</text>
<rect class="data bx" x="150" y="150" width="150" height="36" rx="9"/><text class="t s mut" x="225" y="172" text-anchor="middle">unseal master key</text>
<rect class="code bx" x="310" y="200" width="300" height="36" rx="9"/><text class="t s mut" x="460" y="222" text-anchor="middle">start Watchman (offline snapshot fallback)</text>
<rect class="code bx" x="310" y="250" width="300" height="36" rx="9"/><text class="t s mut" x="460" y="272" text-anchor="middle">start backend (free port, token, clean env)</text>
<rect class="code bx" x="310" y="300" width="230" height="36" rx="9"/><text class="t s mut" x="425" y="322" text-anchor="middle">start UI (Next standalone)</text>
<rect class="code bx" x="620" y="350" width="150" height="36" rx="9"/><text class="t s mut" x="695" y="372" text-anchor="middle">protocol + pollers</text>
