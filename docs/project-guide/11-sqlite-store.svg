<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">SQLite behind mongoose (lib/infra/sqliteStore/)</title>
<desc id="desc">The store implements the parts of the MongoDB driver mongoose uses, so ~170 query call sites never changed.</desc>
<defs><style>
.bg{fill:#f8fafc}
.t{fill:#0f172a}
.h{font-size:20px;font-weight:700}
.b{font-size:14px;font-weight:700}
.m{font-size:13px}
.s{font-size:12px}
.xs{font-size:11px}
.mut{fill:#475569}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bx{stroke-width:1.5}
.dash{stroke-dasharray:6 4}
.code{fill:#eff6ff;stroke:#3b82f6}
.ai{fill:#f5f3ff;stroke:#8b5cf6}
.prompt{fill:#fffbeb;stroke:#d97706}
.data{fill:#f0fdf4;stroke:#16a34a}
.ext{fill:#fff7ed;stroke:#ea580c}
.ui{fill:#ffffff;stroke:#94a3b8}
.warn{fill:#fef2f2;stroke:#ef4444}
.hl{fill:#fde68a;opacity:.45}
.zone{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:8 6}
.zonet{fill:#64748b;font-size:12px;font-weight:700;letter-spacing:.06em}
.ln{fill:none;stroke:#475569;stroke-width:1.6}
.lnd{stroke-dasharray:6 5}
.lno{fill:none;stroke:#ea580c;stroke-width:1.6;stroke-dasharray:6 5}
.ahf{fill:#475569}
.aho{fill:#ea580c}
.life{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:4 4}
.lbl{fill:#475569;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}
.dot{fill:#475569}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ahf" d="M0 0L10 5L0 10z"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="aho" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="1000" height="540"/>
<text class="t h" x="30" y="40">SQLite behind mongoose (lib/infra/sqliteStore/)</text>
<text class="t m mut" x="30" y="62">The store implements the parts of the MongoDB driver mongoose uses, so ~170 query call sites never changed.</text>
<rect class="code bx" x="60" y="92" width="580" height="56" rx="9"/><text class="t b" x="350" y="115" text-anchor="middle">Mongoose models and queries</text><text class="t s mut" x="350" y="135" text-anchor="middle">unchanged from the Atlas days</text>
<path class="ln" d="M350 148 L350 176" marker-end="url(#ah)"/>
<rect class="code bx" x="60" y="176" width="580" height="56" rx="9"/><text class="t b" x="350" y="199" text-anchor="middle">Driver surface</text><text class="t s mut" x="350" y="219" text-anchor="middle">SqliteClient · SqliteDb · SqliteCollection · SqliteCursor</text>
<path class="ln" d="M150 232 L150 262" marker-end="url(#ah)"/>
<path class="ln" d="M350 232 L350 262" marker-end="url(#ah)"/>
<path class="ln" d="M550 232 L550 262" marker-end="url(#ah)"/>
<rect class="code bx" x="60" y="262" width="180" height="64" rx="9"/><text class="t b mono" x="150" y="289" text-anchor="middle">query.ts</text><text class="t s mut" x="150" y="309" text-anchor="middle">filters, dotted paths</text>
<rect class="code bx" x="260" y="262" width="180" height="64" rx="9"/><text class="t b mono" x="350" y="289" text-anchor="middle">update.ts</text><text class="t s mut" x="350" y="309" text-anchor="middle">$set, $inc, $push …</text>
<rect class="code bx" x="460" y="262" width="180" height="64" rx="9"/><text class="t b mono" x="550" y="289" text-anchor="middle">aggregate</text><text class="t s mut" x="550" y="309" text-anchor="middle">$match … $vectorSearch</text>
<path class="ln" d="M350 326 L350 356" marker-end="url(#ah)"/>
<rect class="data bx" x="60" y="356" width="580" height="52" rx="9"/><text class="t b" x="350" y="377" text-anchor="middle">All documents in memory</text><text class="t s mut" x="350" y="397" text-anchor="middle">loaded on open · reads never touch the disk</text>
<path class="ln" d="M350 408 L350 444" marker-end="url(#ah)"/><text class="s lbl" x="360" y="431" text-anchor="start">every write goes straight through</text>
<rect class="data bx" x="60" y="444" width="580" height="60" rx="9"/><text class="t b" x="350" y="469" text-anchor="middle">capscreen.db (WAL)</text><text class="t s mut" x="350" y="489" text-anchor="middle">documents(collection, id, body EJSON, updated_at) · meta(schema_version)</text>
<path class="ln lnd" d="M640 120 L830 120 L830 176" marker-end="url(#ah)"/><text class="s lbl" x="735" y="112" text-anchor="middle">CAPSCREEN_DB=mongodb</text>
<rect class="code bx" x="700" y="176" width="260" height="56" rx="9"/><text class="t b" x="830" y="199" text-anchor="middle">MongoDB driver</text><text class="t s mut" x="830" y="219" text-anchor="middle">auth service only</text>
<path class="lno" d="M718 232 L718 444" marker-end="url(#ao)"/>
<rect class="ext bx" x="700" y="444" width="260" height="60" rx="9"/><text class="t b" x="830" y="469" text-anchor="middle">MongoDB Atlas</text><text class="t s mut" x="830" y="489" text-anchor="middle">accounts</text>
<rect class="ui bx" x="740" y="268" width="220" height="120" rx="9"/><text class="t b" x="754" y="301" text-anchor="start">Also</text><text class="t xs mut" x="754" y="321" text-anchor="start">TTL sweeper every minute</text><text class="t xs mut" x="754" y="336" text-anchor="start">sessions / transactions: no-ops</text><text class="t xs mut" x="754" y="351" text-anchor="start">unknown operator →</text><text class="t xs mut" x="754" y="366" text-anchor="start">UnsupportedOperatorError</text>
</svg>
