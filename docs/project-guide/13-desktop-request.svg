<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">How the window reaches the backend</title>
<desc id="desc">Page code never sees the backend's port or token: the main process adds them.</desc>
<defs><style>
.bg{fill:#f8fafc}
.t{fill:#0f172a}
.h{font-size:20px;font-weight:700}
.b{font-size:14px;font-weight:700}
.m{font-size:13px}
.s{font-size:12px}
.xs{font-size:11px}
.mut{fill:#475569}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bx{stroke-width:1.5}
.dash{stroke-dasharray:6 4}
.code{fill:#eff6ff;stroke:#3b82f6}
.ai{fill:#f5f3ff;stroke:#8b5cf6}
.prompt{fill:#fffbeb;stroke:#d97706}
.data{fill:#f0fdf4;stroke:#16a34a}
.ext{fill:#fff7ed;stroke:#ea580c}
.ui{fill:#ffffff;stroke:#94a3b8}
.warn{fill:#fef2f2;stroke:#ef4444}
.hl{fill:#fde68a;opacity:.45}
.zone{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:8 6}
.zonet{fill:#64748b;font-size:12px;font-weight:700;letter-spacing:.06em}
.ln{fill:none;stroke:#475569;stroke-width:1.6}
.lnd{stroke-dasharray:6 5}
.lno{fill:none;stroke:#ea580c;stroke-width:1.6;stroke-dasharray:6 5}
.ahf{fill:#475569}
.aho{fill:#ea580c}
.life{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:4 4}
.lbl{fill:#475569;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}
.dot{fill:#475569}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ahf" d="M0 0L10 5L0 10z"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="aho" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="1100" height="470"/>
<text class="t h" x="30" y="40">How the window reaches the backend</text>
<text class="t m mut" x="30" y="62">Page code never sees the backend's port or token: the main process adds them.</text>
<rect class="zone" x="30" y="84" width="300" height="330" rx="14"/><text class="zonet" x="46" y="106">RENDERER · SANDBOXED</text>
<rect class="zone" x="370" y="84" width="330" height="330" rx="14"/><text class="zonet" x="386" y="106">ELECTRON MAIN</text>
<rect class="zone" x="740" y="84" width="330" height="330" rx="14"/><text class="zonet" x="756" y="106">LOOPBACK SERVICES + OS</text>
<rect class="ui bx" x="50" y="128" width="260" height="70" rx="9"/><text class="t b" x="180" y="158" text-anchor="middle">Page (Next.js app)</text><text class="t s mut" x="180" y="178" text-anchor="middle">fetch('capscreen://app/__api/…')</text>
<path class="ln" d="M180 198 L180 290" marker-end="url(#ah)"/><text class="s lbl" x="190" y="250" text-anchor="start">window.capscreenDesktop</text>
<rect class="ui bx" x="50" y="290" width="260" height="70" rx="9"/><text class="t b" x="180" y="320" text-anchor="middle">Preload bridge</text><text class="t s mut" x="180" y="340" text-anchor="middle">typed, no Node access</text>
<rect class="code bx" x="390" y="120" width="290" height="90" rx="9"/><text class="t b mono" x="535" y="144" text-anchor="middle">bridge/protocol.ts</text><text class="t s mut" x="535" y="164" text-anchor="middle">capscreen://app → proxy</text><text class="t s mut" x="535" y="180" text-anchor="middle">adds x-capscreen-token to /__api/*</text><text class="t s mut" x="535" y="196" text-anchor="middle">rewrites redirects to the app origin</text>
<rect class="code bx" x="390" y="290" width="290" height="70" rx="9"/><text class="t b mono" x="535" y="320" text-anchor="middle">bridge/ipc.ts</text><text class="t s mut" x="535" y="340" text-anchor="middle">validated handlers only</text>
<path class="ln" d="M310 163 L390 163" marker-end="url(#ah)"/>
<path class="ln" d="M310 325 L390 325" marker-end="url(#ah)"/><text class="s lbl" x="350" y="317" text-anchor="middle">IPC</text>
<rect class="code bx" x="760" y="124" width="290" height="56" rx="9"/><text class="t b" x="905" y="147" text-anchor="middle">UI server</text><text class="t s mut" x="905" y="167" text-anchor="middle">capscreen://app/… pages</text>
<rect class="code bx" x="760" y="196" width="290" height="56" rx="9"/><text class="t b" x="905" y="219" text-anchor="middle">Backend</text><text class="t s mut" x="905" y="239" text-anchor="middle">/__api/* · checks the token</text>
<rect class="ui bx" x="760" y="290" width="290" height="70" rx="9"/><text class="t b" x="905" y="320" text-anchor="middle">OS</text><text class="t s mut" x="905" y="340" text-anchor="middle">save file · open link · notify · print</text>
<path class="ln" d="M680 145 L740 145 L740 152 L760 152" marker-end="url(#ah)"/>
<path class="ln" d="M680 185 L740 185 L740 224 L760 224" marker-end="url(#ah)"/>
<text class="t xs mut" x="905" y="274" text-anchor="middle">both on 127.0.0.1:&lt;random port&gt;</text>
<path class="ln" d="M680 325 L760 325" marker-end="url(#ah)"/>
<text class="t s mut" x="30" y="446" text-anchor="start">Ports change every launch. The fixed capscreen://app origin keeps the page's local storage stable across launches.</text>
</svg>
