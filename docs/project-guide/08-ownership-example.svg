<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Ownership graph: a worked example</title>
<desc id="desc">Arrows point from owner to owned. Effective stake multiplies along each path and adds up across paths.</desc>
<defs><style>
.bg{fill:#f8fafc}
.t{fill:#0f172a}
.h{font-size:20px;font-weight:700}
.b{font-size:14px;font-weight:700}
.m{font-size:13px}
.s{font-size:12px}
.xs{font-size:11px}
.mut{fill:#475569}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bx{stroke-width:1.5}
.dash{stroke-dasharray:6 4}
.code{fill:#eff6ff;stroke:#3b82f6}
.ai{fill:#f5f3ff;stroke:#8b5cf6}
.prompt{fill:#fffbeb;stroke:#d97706}
.data{fill:#f0fdf4;stroke:#16a34a}
.ext{fill:#fff7ed;stroke:#ea580c}
.ui{fill:#ffffff;stroke:#94a3b8}
.warn{fill:#fef2f2;stroke:#ef4444}
.hl{fill:#fde68a;opacity:.45}
.zone{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:8 6}
.zonet{fill:#64748b;font-size:12px;font-weight:700;letter-spacing:.06em}
.ln{fill:none;stroke:#475569;stroke-width:1.6}
.lnd{stroke-dasharray:6 5}
.lno{fill:none;stroke:#ea580c;stroke-width:1.6;stroke-dasharray:6 5}
.ahf{fill:#475569}
.aho{fill:#ea580c}
.life{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:4 4}
.lbl{fill:#475569;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}
.dot{fill:#475569}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ahf" d="M0 0L10 5L0 10z"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="aho" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="1100" height="560"/>
<text class="t h" x="30" y="40">Ownership graph: a worked example</text>
<text class="t m mut" x="30" y="62">Arrows point from owner to owned. Effective stake multiplies along each path and adds up across paths.</text>
<rect class="warn bx" x="60" y="96" width="170" height="56" rx="9"/><text class="t b" x="145" y="119" text-anchor="middle">Person X</text><text class="t s mut" x="145" y="139" text-anchor="middle">Watchman hit</text>
<rect class="ui bx" x="300" y="96" width="170" height="56" rx="9"/><text class="t b" x="385" y="119" text-anchor="middle">Person Y</text><text class="t s mut" x="385" y="139" text-anchor="middle">no hit</text>
<path class="ln" d="M145 152 L225 220" marker-end="url(#ah)"/><text class="s lbl" x="168" y="192" text-anchor="middle">75%</text>
<path class="ln" d="M385 152 L305 220" marker-end="url(#ah)"/><text class="s lbl" x="362" y="192" text-anchor="middle">25%</text>
<rect class="prompt bx" x="170" y="220" width="190" height="56" rx="9"/><text class="t b" x="265" y="243" text-anchor="middle">Holding C</text><text class="t s mut" x="265" y="263" text-anchor="middle">blockable: 75% by X</text>
<rect class="ui bx" x="30" y="344" width="160" height="56" rx="9"/><text class="t b" x="110" y="367" text-anchor="middle">Alice</text><text class="t s mut" x="110" y="387" text-anchor="middle">person, no hit</text>
<rect class="code bx" x="410" y="344" width="180" height="56" rx="9"/><text class="t b" x="500" y="367" text-anchor="middle">Fund B</text><text class="t s mut" x="500" y="387" text-anchor="middle">70% held by LPs</text>
<path class="ln" d="M330 276 L460 344" marker-end="url(#ah)"/><text class="s lbl" x="410" y="302" text-anchor="middle">30%</text>
<path class="ln" d="M255 276 L290 460" marker-end="url(#ah)"/><text class="s lbl" x="290" y="372" text-anchor="middle">25%</text>
<path class="ln" d="M110 400 L235 460" marker-end="url(#ah)"/><text class="s lbl" x="160" y="438" text-anchor="middle">40%</text>
<path class="ln" d="M500 400 L370 460" marker-end="url(#ah)"/><text class="s lbl" x="452" y="438" text-anchor="middle">35%</text>
<rect class="data bx" x="200" y="460" width="220" height="56" rx="9"/><text class="t b" x="310" y="483" text-anchor="middle">NexaFlow AI Inc</text><text class="t s mut" x="310" y="503" text-anchor="middle">the startup</text>
<rect class="ui bx" x="640" y="92" width="430" height="430" rx="9"/><text class="t b" x="656" y="118" text-anchor="start">The numbers</text>
<text class="t s" x="656" y="146" text-anchor="start">Effective stake in NexaFlow</text>
<text class="t s" x="656" y="168" text-anchor="start">Holding C</text><text class="t s mono" x="756" y="168" text-anchor="start">25% + 30% × 35%</text><text class="t s mono" x="1050" y="168" text-anchor="end">35.5%</text>
<text class="t s" x="656" y="188" text-anchor="start">Person X</text><text class="t s mono" x="756" y="188" text-anchor="start">75% × 35.5%</text><text class="t s mono" x="1050" y="188" text-anchor="end">26.6%</text>
<text class="t s" x="656" y="208" text-anchor="start">Person Y</text><text class="t s mono" x="756" y="208" text-anchor="start">25% × 35.5%</text><text class="t s mono" x="1050" y="208" text-anchor="end">8.9%</text>
<text class="t s" x="656" y="228" text-anchor="start">Alice</text><text class="t s mono" x="756" y="228" text-anchor="start">direct</text><text class="t s mono" x="1050" y="228" text-anchor="end">40.0%</text>
<text class="t s" x="656" y="266" text-anchor="start">What the rules do</text>
<text class="t s mut" x="656" y="290" text-anchor="start">Person X: tier from its score; flag ubo_25 (26.6% ≥ 25%)</text>
<text class="t s mut" x="656" y="314" text-anchor="start">Holding C: no hit, but X owns ≥ 50%, so it is blockable;</text>
<text class="t s mut" x="656" y="330" text-anchor="start">it starts at review and ofac_50 escalates it to flagged</text>
<text class="t s mut" x="656" y="354" text-anchor="start">Fund B: blockable owners hold 30% &lt; 50%, not blockable</text>
<text class="t s mut" x="656" y="378" text-anchor="start">Alice: ubo_25 flag (40%), but no hit, so she stays clear</text>
<text class="t s" x="656" y="416" text-anchor="start">Ownership path for X (BFS from the startup):</text>
<text class="t s mono" x="656" y="438" text-anchor="start">NexaFlow → Holding C → Person X</text>
<text class="t s mut" x="656" y="474" text-anchor="start">Any non-clear entity counts as sanctioned for the</text>
<text class="t s mut" x="656" y="492" text-anchor="start">50% rule (section 20.3). Thresholds: Settings → Screening.</text>
</svg>
