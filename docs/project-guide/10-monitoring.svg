.ln{fill:none;stroke:#475569;stroke-width:1.6}
.lnd{stroke-dasharray:6 5}
.lno{fill:none;stroke:#ea580c;stroke-width:1.6;stroke-dasharray:6 5}
.ahf{fill:#475569}
.aho{fill:#ea580c}
.life{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:4 4}
.lbl{fill:#475569;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}
.dot{fill:#475569}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ahf" d="M0 0L10 5L0 10z"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="aho" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="1070" height="330"/>
<text class="t h" x="30" y="40">Background re-screening (modules/portfolio/rescreen.service.ts)</text>
<text class="t m mut" x="30" y="62">Sanctions lists change; saved screenings are re-run on a schedule and new problems raise a notification.</text>
<rect class="code bx" x="30" y="110" width="150" height="96" rx="9"/><text class="t b" x="105" y="145" text-anchor="middle">Scheduler</text><text class="t s mut" x="105" y="165" text-anchor="middle">checks every</text><text class="t s mut" x="105" y="181" text-anchor="middle">15 minutes</text>
<path class="ln" d="M180 158 L202 158" marker-end="url(#ah)"/>
<rect class="code bx" x="202" y="110" width="150" height="96" rx="9"/><text class="t b" x="277" y="145" text-anchor="middle">Due?</text><text class="t s mut" x="277" y="165" text-anchor="middle">enabled, last digest</text><text class="t s mut" x="277" y="181" text-anchor="middle">older than 24 h</text>
<path class="ln" d="M352 158 L374 158" marker-end="url(#ah)"/>
<rect class="code bx" x="374" y="110" width="150" height="96" rx="9"/><text class="t b" x="449" y="137" text-anchor="middle">Re-screen</text><text class="t s mut" x="449" y="157" text-anchor="middle">each startup's cap</text><text class="t s mut" x="449" y="173" text-anchor="middle">table, co-investors,</text><text class="t s mut" x="449" y="189" text-anchor="middle">vendors</text>
<path class="ln" d="M524 158 L546 158" marker-end="url(#ah)"/>
<rect class="code bx" x="546" y="110" width="150" height="96" rx="9"/><text class="t b" x="621" y="153" text-anchor="middle">Snapshot + delta</text><text class="t s mut" x="621" y="173" text-anchor="middle">what got worse</text>
<path class="ln" d="M696 158 L718 158" marker-end="url(#ah)"/>
<rect class="data bx" x="718" y="110" width="150" height="96" rx="9"/><text class="t b" x="793" y="145" text-anchor="middle">Digest</text><text class="t s mut" x="793" y="165" text-anchor="middle">saved; optional</text><text class="t s mut" x="793" y="181" text-anchor="middle">webhook POST</text>
<path class="ln" d="M868 158 L890 158" marker-end="url(#ah)"/>
<rect class="ext bx" x="890" y="110" width="150" height="96" rx="9"/><text class="t b" x="965" y="137" text-anchor="middle">Notification</text><text class="t s mut" x="965" y="157" text-anchor="middle">desktop poller →</text><text class="t s mut" x="965" y="173" text-anchor="middle">native alert →</text><text class="t s mut" x="965" y="189" text-anchor="middle">deep link</text>
<path class="ln" d="M277 206 L277 246 L105 246 L105 206" marker-end="url(#ah)"/><text class="s lbl" x="191" y="240" text-anchor="middle">not due yet</text>
<text class="t s mut" x="30" y="296" text-anchor="start">Interval and on/off live in settings.json (Settings → Sanctions data). The webhook URL is DIGEST_WEBHOOK_URL.</text>
</svg>
