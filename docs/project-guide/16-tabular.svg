<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Tabular reviews: three kinds and the Status write-back</title>
<desc id="desc">A review is a grid. Where its cells come from depends on the kind; the Status column is the person's decision.</desc>
<defs><style>
.bg{fill:#f8fafc}
.t{fill:#0f172a}
.h{font-size:20px;font-weight:700}
.b{font-size:14px;font-weight:700}
.m{font-size:13px}
.s{font-size:12px}
.xs{font-size:11px}
.mut{fill:#475569}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bx{stroke-width:1.5}
.dash{stroke-dasharray:6 4}
.code{fill:#eff6ff;stroke:#3b82f6}
.ai{fill:#f5f3ff;stroke:#8b5cf6}
.prompt{fill:#fffbeb;stroke:#d97706}
.data{fill:#f0fdf4;stroke:#16a34a}
.ext{fill:#fff7ed;stroke:#ea580c}
.ui{fill:#ffffff;stroke:#94a3b8}
.warn{fill:#fef2f2;stroke:#ef4444}
.hl{fill:#fde68a;opacity:.45}
.zone{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:8 6}
.zonet{fill:#64748b;font-size:12px;font-weight:700;letter-spacing:.06em}
.ln{fill:none;stroke:#475569;stroke-width:1.6}
.lnd{stroke-dasharray:6 5}
.lno{fill:none;stroke:#ea580c;stroke-width:1.6;stroke-dasharray:6 5}
.ahf{fill:#475569}
.aho{fill:#ea580c}
.life{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:4 4}
.lbl{fill:#475569;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}
.dot{fill:#475569}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ahf" d="M0 0L10 5L0 10z"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="aho" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="1100" height="430"/>
<text class="t h" x="30" y="40">Tabular reviews: three kinds and the Status write-back</text>
<text class="t m mut" x="30" y="62">A review is a grid. Where its cells come from depends on the kind; the Status column is the person's decision.</text>
<rect class="ai bx" x="30" y="92" width="330" height="84" rx="9"/><text class="t b mono" x="195" y="121" text-anchor="middle">standard</text><text class="t s mut" x="195" y="141" text-anchor="middle">rows = documents</text><text class="t s mut" x="195" y="157" text-anchor="middle">cells written by the model from each document</text>
<rect class="code bx" x="385" y="92" width="330" height="84" rx="9"/><text class="t b mono" x="550" y="121" text-anchor="middle">entity_screening</text><text class="t s mut" x="550" y="141" text-anchor="middle">rows = entities from a screen</text><text class="t s mut" x="550" y="157" text-anchor="middle">cells straight from the screening result</text>
<rect class="code bx" x="740" y="92" width="330" height="84" rx="9"/><text class="t b mono" x="905" y="121" text-anchor="middle">portfolio_monitoring</text><text class="t s mut" x="905" y="141" text-anchor="middle">rows = startups</text><text class="t s mut" x="905" y="157" text-anchor="middle">kept in sync after every screen</text>
<rect class="code bx" x="30" y="250" width="220" height="70" rx="9"/><text class="t b" x="140" y="280" text-anchor="middle">Screen / re-screen</text><text class="t s mut" x="140" y="300" text-anchor="middle">new result for a startup</text>
<path class="ln" d="M250 285 L300 285" marker-end="url(#ah)"/>
<rect class="ui bx" x="300" y="240" width="240" height="90" rx="9"/><text class="t b" x="420" y="264" text-anchor="middle">Grid</text><text class="t s mut" x="420" y="284" text-anchor="middle">Status cell:</text><text class="t s mut" x="420" y="300" text-anchor="middle">cleared · escalated</text><text class="t s mut" x="420" y="316" text-anchor="middle">blocked · pending</text>
<path class="ln" d="M540 285 L590 285" marker-end="url(#ah)" marker-start="url(#ah)"/>
<rect class="code bx" x="590" y="250" width="220" height="70" rx="9"/><text class="t b mono" x="700" y="280" text-anchor="middle">reviewStatusSync</text><text class="t s mut" x="700" y="300" text-anchor="middle">keeps both sides equal</text>
<path class="ln" d="M810 285 L860 285" marker-end="url(#ah)" marker-start="url(#ah)"/>
<rect class="data bx" x="860" y="250" width="210" height="70" rx="9"/><text class="t b" x="965" y="272" text-anchor="middle">Decisions</text><text class="t s mut" x="965" y="292" text-anchor="middle">EntityReview or the</text><text class="t s mut" x="965" y="308" text-anchor="middle">startup's portfolio status</text>
<text class="t s mut" x="30" y="372" text-anchor="start">Grid chat sees the grid as a Markdown table (first 80 rows) and uses the same agent and tools as the assistant.</text>
<text class="t s mut" x="30" y="392" text-anchor="start">Grids export to Excel in the browser.</text>
</svg>
