<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 450" width="1100" height="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Building the installers (desktop/scripts, electron-builder.yml)</title>
<desc id="desc">Four build steps feed electron-builder. Build each OS on that OS.</desc>
