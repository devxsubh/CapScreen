<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Two databases, never connected</title>
<desc id="desc">Same mongoose models, two stores. CAPSCREEN_DB decides which one a process opens.</desc>
<defs><style>
.bg{fill:#f8fafc}
.t{fill:#0f172a}
.h{font-size:20px;font-weight:700}
.b{font-size:14px;font-weight:700}
.m{font-size:13px}
.s{font-size:12px}
.xs{font-size:11px}
.mut{fill:#475569}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bx{stroke-width:1.5}
.dash{stroke-dasharray:6 4}
.code{fill:#eff6ff;stroke:#3b82f6}
.ai{fill:#f5f3ff;stroke:#8b5cf6}
.prompt{fill:#fffbeb;stroke:#d97706}
.data{fill:#f0fdf4;stroke:#16a34a}
.ext{fill:#fff7ed;stroke:#ea580c}
.ui{fill:#ffffff;stroke:#94a3b8}
.warn{fill:#fef2f2;stroke:#ef4444}
.hl{fill:#fde68a;opacity:.45}
.zone{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:8 6}
.zonet{fill:#64748b;font-size:12px;font-weight:700;letter-spacing:.06em}
.ln{fill:none;stroke:#475569;stroke-width:1.6}
.lnd{stroke-dasharray:6 5}
.lno{fill:none;stroke:#ea580c;stroke-width:1.6;stroke-dasharray:6 5}
.ahf{fill:#475569}
.aho{fill:#ea580c}
.life{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:4 4}
.lbl{fill:#475569;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}
.dot{fill:#475569}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ahf" d="M0 0L10 5L0 10z"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="aho" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="1000" height="460"/>
<text class="t h" x="30" y="40">Two databases, never connected</text>
<text class="t m mut" x="30" y="62">Same mongoose models, two stores. CAPSCREEN_DB decides which one a process opens.</text>
<rect class="zone" x="30" y="84" width="440" height="346" rx="14"/><text class="zonet" x="46" y="106">YOUR COMPUTER</text>
<rect class="zone" x="530" y="84" width="440" height="346" rx="14"/><text class="zonet" x="546" y="106">CLOUD · VERCEL + ATLAS</text>
<rect class="code bx" x="60" y="116" width="380" height="56" rx="9"/><text class="t b" x="250" y="139" text-anchor="middle">Electron shell</text><text class="t s mut" x="250" y="159" text-anchor="middle">signs in, keeps the session in the keychain</text>
<path class="ln" d="M250 172 L250 204" marker-end="url(#ah)"/><text class="s lbl" x="260" y="193" text-anchor="start">identity.json (email, name)</text>
<rect class="code bx" x="60" y="204" width="380" height="56" rx="9"/><text class="t b" x="250" y="227" text-anchor="middle">Desktop backend</text><text class="t s mut" x="250" y="247" text-anchor="middle">CAPSCREEN_DB unset → SQLite</text>
<path class="ln" d="M250 260 L250 292" marker-end="url(#ah)"/>
<rect class="data bx" x="60" y="292" width="380" height="110" rx="9"/><text class="t b" x="250" y="326" text-anchor="middle">SQLite · &lt;userData&gt;/capscreen.db</text><text class="t s mut" x="250" y="346" text-anchor="middle">startups, cap tables, screenings, reviews</text><text class="t s mut" x="250" y="362" text-anchor="middle">documents + chunks, chats, workflows</text><text class="t s mut" x="250" y="378" text-anchor="middle">tabular reviews, audit log</text>
<rect class="code bx" x="560" y="116" width="380" height="56" rx="9"/><text class="t b" x="750" y="139" text-anchor="middle">Auth service (Vercel)</text><text class="t s mut" x="750" y="159" text-anchor="middle">CAPSCREEN_DB=mongodb</text>
<path class="ln" d="M750 172 L750 292" marker-end="url(#ah)"/>
<rect class="data bx" x="560" y="292" width="380" height="110" rx="9"/><text class="t b" x="750" y="326" text-anchor="middle">MongoDB Atlas</text><text class="t s mut" x="750" y="346" text-anchor="middle">User · AuthToken</text><text class="t s mut" x="750" y="362" text-anchor="middle">EmailToken · DesktopAuthCode</text><text class="t s mut" x="750" y="378" text-anchor="middle">accounts only</text>
<path class="lno" d="M440 144 L560 144" marker-end="url(#ao)" marker-start="url(#ao)"/><text class="s lbl" x="500" y="136" text-anchor="middle">sign-in + tokens</text>
<path d="M440 347 L560 347" fill="none" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="6 5"/>
<circle cx="500" cy="347" r="11" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><path d="M495 342L505 352M505 342L495 352" stroke="#ef4444" stroke-width="2"/>
<text class="s lbl" x="500" y="378" text-anchor="middle">never linked</text>
</svg>
