.ui{fill:#ffffff;stroke:#94a3b8}
.warn{fill:#fef2f2;stroke:#ef4444}
.hl{fill:#fde68a;opacity:.45}
.zone{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:8 6}
.zonet{fill:#64748b;font-size:12px;font-weight:700;letter-spacing:.06em}
.ln{fill:none;stroke:#475569;stroke-width:1.6}
.lnd{stroke-dasharray:6 5}
.lno{fill:none;stroke:#ea580c;stroke-width:1.6;stroke-dasharray:6 5}
.ahf{fill:#475569}
.aho{fill:#ea580c}
.life{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:4 4}
.lbl{fill:#475569;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}
.dot{fill:#475569}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ahf" d="M0 0L10 5L0 10z"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="aho" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="1180" height="420"/>
<text class="t h" x="30" y="40">Frontend layers (frontend/src/)</text>
<text class="t m mut" x="30" y="62">Routes are thin; each feature owns its components, hooks and helpers; every backend call goes through api/.</text>
<rect class="ui bx" x="30" y="110" width="150" height="70" rx="9"/><text class="t b mono" x="105" y="140" text-anchor="middle">app/</text><text class="t s mut" x="105" y="160" text-anchor="middle">routes, thin pages</text>
<path class="ln" d="M180 145 L205 145" marker-end="url(#ah)"/>
<rect class="ui bx" x="205" y="110" width="190" height="70" rx="9"/><text class="t b mono" x="300" y="132" text-anchor="middle">features/&lt;f&gt;/</text><text class="t s mut" x="300" y="152" text-anchor="middle">components/ incl.</text><text class="t s mut" x="300" y="168" text-anchor="middle">the &lt;Name&gt;Page</text>
<path class="ln" d="M395 145 L420 145" marker-end="url(#ah)"/>
<rect class="code bx" x="420" y="110" width="170" height="70" rx="9"/><text class="t b mono" x="505" y="140" text-anchor="middle">hooks/</text><text class="t s mut" x="505" y="160" text-anchor="middle">data loading, SSE</text>
<path class="ln" d="M590 145 L615 145" marker-end="url(#ah)"/>
<rect class="code bx" x="615" y="110" width="170" height="70" rx="9"/><text class="t b mono" x="700" y="132" text-anchor="middle">api/&lt;module&gt;.ts</text><text class="t s mut" x="700" y="152" text-anchor="middle">one per backend</text><text class="t s mut" x="700" y="168" text-anchor="middle">module</text>
<path class="ln" d="M785 145 L810 145" marker-end="url(#ah)"/>
<rect class="code bx" x="810" y="110" width="160" height="70" rx="9"/><text class="t b mono" x="890" y="132" text-anchor="middle">client.ts</text><text class="t s mut" x="890" y="152" text-anchor="middle">apiBase() picks</text><text class="t s mut" x="890" y="168" text-anchor="middle">the origin</text>
<path class="ln" d="M970 132 L995 132 L995 112 L1010 112" marker-end="url(#ah)"/>
<path class="ln" d="M970 158 L995 158 L995 186 L1010 186" marker-end="url(#ah)"/>
