<rect class="ui bx" x="1010" y="162" width="150" height="50" rx="9"/><text class="t b" x="1085" y="182" text-anchor="middle">pnpm dev</text><text class="t s mut" x="1085" y="202" text-anchor="middle">localhost:3001</text>
<rect class="ui bx" x="205" y="260" width="580" height="64" rx="9"/><text class="t b" x="495" y="287" text-anchor="middle">Shared code</text><text class="t s mut" x="495" y="307" text-anchor="middle">components/ (ui, layout, chat, common) · contexts/ · hooks/ · lib/ (desktop bridge) · types/</text>
<path class="ln" d="M300 260 L300 180" marker-end="url(#ah)"/>
<path class="ln" d="M505 260 L505 180" marker-end="url(#ah)"/>
<path class="ln lnd" d="M785 292 L840 292" marker-end="url(#ah)"/><text class="s lbl" x="812" y="284" text-anchor="middle">types</text>
<rect class="code bx" x="840" y="260" width="320" height="64" rx="9"/><text class="t b mono" x="1000" y="287" text-anchor="middle">backend/src/types/screening.ts</text><text class="t s mut" x="1000" y="307" text-anchor="middle">one contract, imported type-only</text>
<text class="t s mut" x="30" y="376" text-anchor="start">A file used by one feature lives in that feature; a file used by several lives in components/, hooks/, lib/ or types/.</text>
</svg>
