.aho{fill:#ea580c}
.life{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:4 4}
.lbl{fill:#475569;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}
.dot{fill:#475569}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ahf" d="M0 0L10 5L0 10z"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="aho" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="1060" height="720"/>
<text class="t h" x="30" y="40">The agent graph (lib/agent/agentGraph.ts)</text>
<text class="t m mut" x="30" y="62">A LangGraph StateGraph. Routing is two plain functions of the state: afterModel and afterTools.</text>
<circle class="dot" cx="70" cy="300" r="12"/>
<text class="t xs mut" x="70" y="330" text-anchor="middle">START</text>
<path class="ln" d="M82 300 L150 300" marker-end="url(#ah)"/>
<circle class="ui bx" cx="250" cy="140" r="26"/><circle class="ui bx" cx="250" cy="140" r="20"/>
<text class="t xs" x="250" y="144" text-anchor="middle">END</text>
<rect class="ai bx" x="150" y="265" width="200" height="70" rx="9"/><text class="t b mono" x="250" y="295" text-anchor="middle">callModel</text><text class="t s mut" x="250" y="315" text-anchor="middle">stream reply, collect calls</text>
<path class="ln" d="M250 265 L250 167" marker-end="url(#ah)"/><text class="s lbl" x="262" y="220" text-anchor="start">no tool calls</text>
<rect class="code bx" x="560" y="265" width="200" height="70" rx="9"/><text class="t b mono" x="660" y="295" text-anchor="middle">runTools</text><text class="t s mut" x="660" y="315" text-anchor="middle">run batches, add results</text>
<path class="ln" d="M350 288 L560 288" marker-end="url(#ah)"/><text class="s lbl" x="455" y="281" text-anchor="middle">tool calls</text>
<path class="ln" d="M560 314 L350 314" marker-end="url(#ah)"/><text class="s lbl" x="455" y="333" text-anchor="middle">rounds &lt; max</text>
<rect class="prompt bx" x="355" y="420" width="200" height="70" rx="9"/><text class="t b mono" x="455" y="450" text-anchor="middle">askApproval</text><text class="t s mut" x="455" y="470" text-anchor="middle">interrupt() · wait for user</text>
<path class="ln" d="M250 335 L250 455 L355 455" marker-end="url(#ah)"/><text class="s lbl" x="262" y="400" text-anchor="start">needs approval</text>
<path class="ln" d="M555 455 L660 455 L660 335" marker-end="url(#ah)"/><text class="s lbl" x="672" y="400" text-anchor="start">Allow / Deny</text>
<text class="t xs mut" x="455" y="512" text-anchor="middle">state saved by the checkpointer; resumed with Command({ resume })</text>
<rect class="warn bx" x="850" y="265" width="190" height="70" rx="9"/><text class="t b mono" x="945" y="295" text-anchor="middle">stopAtRoundLimit</text><text class="t s mut" x="945" y="315" text-anchor="middle">'hit the tool-call limit'</text>
