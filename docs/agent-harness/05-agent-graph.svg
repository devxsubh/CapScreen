<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 720" width="1060" height="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">The agent graph (lib/agent/agentGraph.ts)</title>
<desc id="desc">A LangGraph StateGraph. Routing is two plain functions of the state: afterModel and afterTools.</desc>
<defs><style>
.bg{fill:#f8fafc}
.t{fill:#0f172a}
.h{font-size:20px;font-weight:700}
.b{font-size:14px;font-weight:700}
.m{font-size:13px}
.s{font-size:12px}
.xs{font-size:11px}
.mut{fill:#475569}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bx{stroke-width:1.5}
.dash{stroke-dasharray:6 4}
.code{fill:#eff6ff;stroke:#3b82f6}
.ai{fill:#f5f3ff;stroke:#8b5cf6}
