<path class="ln" d="M945 265 L945 140 L278 140" marker-end="url(#ah)"/><text class="s lbl" x="600" y="133" text-anchor="middle">limit message</text>
<rect class="ui bx" x="40" y="548" width="480" height="150" rx="9"/><text class="t b" x="56" y="574" text-anchor="start">State (saved in checkpoints)</text>
<text class="t s mono" x="56" y="604" text-anchor="start">messages</text><text class="t xs mut" x="125.52" y="604" text-anchor="start">append</text>
<text class="t s mono" x="56" y="626" text-anchor="start">pendingCalls</text>
<text class="t s mono" x="56" y="648" text-anchor="start">needsApproval</text>
<text class="t s mono" x="56" y="670" text-anchor="start">declinedIds</text>
<text class="t s mono" x="280" y="604" text-anchor="start">rounds</text>
<text class="t s mono" x="280" y="626" text-anchor="start">answer</text><text class="t xs mut" x="334.64" y="626" text-anchor="start">concatenate</text>
<text class="t s mono" x="280" y="648" text-anchor="start">toolActivity</text><text class="t xs mut" x="379.28" y="648" text-anchor="start">append</text>
<text class="t s mono" x="280" y="670" text-anchor="start">systemPrompt · maxRounds</text>
<rect class="ui bx" x="540" y="548" width="480" height="150" rx="9"/><text class="t b" x="556" y="574" text-anchor="start">Runtime context (never saved)</text>
<text class="t s mono" x="556" y="604" text-anchor="start">registry</text><text class="t xs mut" x="625.52" y="604" text-anchor="start">tools for this run</text>
<text class="t s mono" x="556" y="626" text-anchor="start">executeTool</text><text class="t xs mut" x="647.84" y="626" text-anchor="start">wraps the registry</text>
<text class="t s mono" x="556" y="648" text-anchor="start">write</text><text class="t xs mut" x="603.2" y="648" text-anchor="start">SSE writer</text>
<text class="t s mono" x="556" y="670" text-anchor="start">role</text><text class="t xs mut" x="595.76" y="670" text-anchor="start">agent</text>
<text class="t s mono" x="780" y="604" text-anchor="start">maxTokens</text><text class="t xs mut" x="856.96" y="604" text-anchor="start">8192 / 2048</text>
<text class="t s mono" x="780" y="626" text-anchor="start">toolChoice</text><text class="t xs mut" x="864.4" y="626" text-anchor="start">round 0 only</text>
<text class="t s mono" x="780" y="648" text-anchor="start">askBeforeSensitiveTools</text>
</svg>
