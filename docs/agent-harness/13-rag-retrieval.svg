<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Document search (lib/rag/retrieveChunks.ts)</title>
<desc id="desc">Vector search when an embedding model is set; keyword search when it isn't or finds nothing.</desc>
<defs><style>
.bg{fill:#f8fafc}
.t{fill:#0f172a}
.h{font-size:20px;font-weight:700}
.b{font-size:14px;font-weight:700}
.m{font-size:13px}
.s{font-size:12px}
.xs{font-size:11px}
.mut{fill:#475569}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bx{stroke-width:1.5}
.dash{stroke-dasharray:6 4}
.code{fill:#eff6ff;stroke:#3b82f6}
.ai{fill:#f5f3ff;stroke:#8b5cf6}
.prompt{fill:#fffbeb;stroke:#d97706}
.data{fill:#f0fdf4;stroke:#16a34a}
.ext{fill:#fff7ed;stroke:#ea580c}
.ui{fill:#ffffff;stroke:#94a3b8}
.warn{fill:#fef2f2;stroke:#ef4444}
.hl{fill:#fde68a;opacity:.45}
.zone{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:8 6}
.zonet{fill:#64748b;font-size:12px;font-weight:700;letter-spacing:.06em}
.ln{fill:none;stroke:#475569;stroke-width:1.6}
.lnd{stroke-dasharray:6 5}
.lno{fill:none;stroke:#ea580c;stroke-width:1.6;stroke-dasharray:6 5}
.ahf{fill:#475569}
.aho{fill:#ea580c}
.life{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:4 4}
.lbl{fill:#475569;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}
.dot{fill:#475569}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ahf" d="M0 0L10 5L0 10z"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="aho" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="1000" height="450"/>
<text class="t h" x="30" y="40">Document search (lib/rag/retrieveChunks.ts)</text>
<text class="t m mut" x="30" y="62">Vector search when an embedding model is set; keyword search when it isn't or finds nothing.</text>
<rect class="ui bx" x="30" y="172" width="130" height="60" rx="9"/><text class="t b" x="95" y="197" text-anchor="middle">Query</text><text class="t s mut" x="95" y="217" text-anchor="middle">from the model</text>
<path class="ln" d="M160 202 L190 202" marker-end="url(#ah)"/>
<rect class="ui bx" x="190" y="168" width="160" height="68" rx="9"/><text class="t b" x="270" y="197" text-anchor="middle">Embedding</text><text class="t s mut" x="270" y="217" text-anchor="middle">model configured?</text>
<path class="ln" d="M350 190 L372 190 L372 133 L400 133" marker-end="url(#ah)"/><text class="s lbl" x="380" y="168" text-anchor="start">yes</text>
<path class="ln" d="M350 214 L372 214 L372 333 L400 333" marker-end="url(#ah)"/><text class="s lbl" x="380" y="280" text-anchor="start">no</text>
<rect class="ai bx" x="400" y="100" width="160" height="66" rx="9"/><text class="t b" x="480" y="128" text-anchor="middle">Embed the query</text><text class="t s mut" x="480" y="148" text-anchor="middle">same model as chunks</text>
<path class="ln" d="M560 133 L585 133" marker-end="url(#ah)"/>
<rect class="code bx" x="585" y="100" width="185" height="66" rx="9"/><text class="t b" x="677.5" y="120" text-anchor="middle">Exact cosine</text><text class="t s mut" x="677.5" y="140" text-anchor="middle">this startup's chunks</text><text class="t s mut" x="677.5" y="156" text-anchor="middle">score = (1 + cos) / 2</text>
<path class="ln" d="M770 133 L795 133" marker-end="url(#ah)"/>
<rect class="code bx" x="795" y="100" width="175" height="66" rx="9"/><text class="t b" x="882.5" y="120" text-anchor="middle">Filter</text><text class="t s mut" x="882.5" y="140" text-anchor="middle">score ≥ 0.60</text><text class="t s mut" x="882.5" y="156" text-anchor="middle">keep the top 6</text>
<path class="ln" d="M882 166 L882 300" marker-end="url(#ah)"/><text class="s lbl" x="890" y="238" text-anchor="start">hits</text>
<path class="ln" d="M820 166 L820 220 L580 220 L580 300" marker-end="url(#ah)"/><text class="s lbl" x="700" y="213" text-anchor="middle">no hits</text>
<rect class="code bx" x="400" y="300" width="360" height="66" rx="9"/><text class="t b" x="580" y="320" text-anchor="middle">Keyword search</text><text class="t s mut" x="580" y="340" text-anchor="middle">words &gt; 2 letters · scan up to 300 chunks</text><text class="t s mut" x="580" y="356" text-anchor="middle">score = share of words found · top 6</text>
<path class="ln" d="M760 333 L795 333" marker-end="url(#ah)"/>
<rect class="data bx" x="795" y="300" width="175" height="66" rx="9"/><text class="t b" x="882.5" y="328" text-anchor="middle">Excerpts</text><text class="t s mut" x="882.5" y="348" text-anchor="middle">file · page · relevance %</text>
<text class="t s mut" x="30" y="410" text-anchor="start">Chunks embedded with a different model (different vector length) are skipped. No reranking or hybrid scoring yet.</text>
</svg>
