<rect class="ui bx" x="355" y="460" width="290" height="76" rx="9"/><text class="t b" x="500" y="485" text-anchor="middle">Same ToolContext</text><text class="t s mut" x="500" y="505" text-anchor="middle">sees the parent's screening,</text><text class="t s mut" x="500" y="521" text-anchor="middle">mentions and open startup</text>
<rect class="warn bx" x="670" y="460" width="290" height="76" rx="9"/><text class="t b" x="815" y="485" text-anchor="middle">Can't</text><text class="t s mut" x="815" y="505" text-anchor="middle">screen, write documents, search</text><text class="t s mut" x="815" y="521" text-anchor="middle">the web or delegate again</text>
