<path class="ln" d="M500 184 L500 218" marker-end="url(#ah)" marker-start="url(#ah)"/>
<path class="ln" d="M820 184 L820 218" marker-end="url(#ah)" marker-start="url(#ah)"/>
<rect class="ai bx dash" x="40" y="218" width="280" height="96" rx="9"/><text class="t b" x="180" y="253" text-anchor="middle">Sub-agent A</text><text class="t s mut" x="180" y="273" text-anchor="middle">'Why is Entity A flagged?'</text><text class="t s mut" x="180" y="289" text-anchor="middle">no chat history · max 5 rounds</text>
<rect class="ai bx dash" x="360" y="218" width="280" height="96" rx="9"/><text class="t b" x="500" y="253" text-anchor="middle">Sub-agent B</text><text class="t s mut" x="500" y="273" text-anchor="middle">'What does the SHA say about B?'</text><text class="t s mut" x="500" y="289" text-anchor="middle">no chat history · max 5 rounds</text>
<rect class="ai bx dash" x="680" y="218" width="280" height="96" rx="9"/><text class="t b" x="820" y="253" text-anchor="middle">Sub-agent C</text><text class="t s mut" x="820" y="273" text-anchor="middle">'Our policy for an 85% match?'</text><text class="t s mut" x="820" y="289" text-anchor="middle">no chat history · max 5 rounds</text>
<path class="ln" d="M180 314 L180 360" marker-end="url(#ah)" marker-start="url(#ah)"/>
