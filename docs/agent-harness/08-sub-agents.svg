<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ahf" d="M0 0L10 5L0 10z"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="aho" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="1000" height="570"/>
<text class="t h" x="30" y="40">Sub-agents (delegate_task)</text>
<text class="t m mut" x="30" y="62">The same graph, compiled without a checkpointer, with read-only tools and no output to the screen.</text>
<rect class="ai bx" x="330" y="88" width="340" height="64" rx="9"/><text class="t b" x="500" y="115" text-anchor="middle">Main agent · one round</text><text class="t s mut" x="500" y="135" text-anchor="middle">asks for delegate_task × 3, run in parallel</text>
<path class="ln" d="M500 152 L500 184"/>
<path class="ln" d="M180 184 L820 184"/>
<text class="s lbl" x="500" y="178" text-anchor="middle">task in  ·  findings out</text>
