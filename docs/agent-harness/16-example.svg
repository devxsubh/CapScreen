<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 530" width="1100" height="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Worked example: 'Investigate the flagged entities and draft an IC memo'</title>
<desc id="desc">One turn, five model calls. Each column is one pass through callModel → runTools.</desc>
<defs><style>
.bg{fill:#f8fafc}
.t{fill:#0f172a}
.h{font-size:20px;font-weight:700}
.b{font-size:14px;font-weight:700}
.m{font-size:13px}
.s{font-size:12px}
.xs{font-size:11px}
.mut{fill:#475569}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bx{stroke-width:1.5}
.dash{stroke-dasharray:6 4}
.code{fill:#eff6ff;stroke:#3b82f6}
.ai{fill:#f5f3ff;stroke:#8b5cf6}
.prompt{fill:#fffbeb;stroke:#d97706}
.data{fill:#f0fdf4;stroke:#16a34a}
.ext{fill:#fff7ed;stroke:#ea580c}
.ui{fill:#ffffff;stroke:#94a3b8}
.warn{fill:#fef2f2;stroke:#ef4444}
.hl{fill:#fde68a;opacity:.45}
.zone{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:8 6}
.zonet{fill:#64748b;font-size:12px;font-weight:700;letter-spacing:.06em}
.ln{fill:none;stroke:#475569;stroke-width:1.6}
.lnd{stroke-dasharray:6 5}
.lno{fill:none;stroke:#ea580c;stroke-width:1.6;stroke-dasharray:6 5}
.ahf{fill:#475569}
.aho{fill:#ea580c}
.life{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:4 4}
.lbl{fill:#475569;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}
.dot{fill:#475569}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ahf" d="M0 0L10 5L0 10z"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="aho" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="1100" height="530"/>
<text class="t h" x="30" y="40">Worked example: 'Investigate the flagged entities and draft an IC memo'</text>
<text class="t m mut" x="30" y="62">One turn, five model calls. Each column is one pass through callModel → runTools.</text>
<text class="zonet" x="30" y="100" text-anchor="start">Round 1</text>
<rect class="ai bx" x="30" y="110" width="190" height="60" rx="9"/><text class="t b" x="125" y="135" text-anchor="middle">Model</text><text class="t s mut" x="125" y="155" text-anchor="middle">posts a 4-step plan</text>
<path class="ln" d="M125 170 L125 210" marker-end="url(#ah)"/>
<rect class="code bx" x="30" y="210" width="190" height="110" rx="9"/><text class="t b mono" x="125" y="260" text-anchor="middle">update_plan</text><text class="t s mut" x="125" y="280" text-anchor="middle">→ plan_updated</text>
<path class="ln" d="M220 265 L232 265 L232 140 L244 140" marker-end="url(#ah)"/>
<path class="ln lnd" d="M125 320 L125 370" marker-end="url(#ah)"/>
<rect class="ui bx" x="30" y="370" width="190" height="54" rx="9"/><text class="t b" x="125" y="392" text-anchor="middle">User sees</text><text class="t s mut" x="125" y="412" text-anchor="middle">Checklist appears</text>
<text class="zonet" x="244" y="100" text-anchor="start">Round 2</text>
<rect class="ai bx" x="244" y="110" width="190" height="60" rx="9"/><text class="t b" x="339" y="135" text-anchor="middle">Model</text><text class="t s mut" x="339" y="155" text-anchor="middle">2 × delegate_task</text>
<path class="ln" d="M339 170 L339 210" marker-end="url(#ah)"/>
<rect class="ai bx" x="244" y="210" width="190" height="50" rx="9"/><text class="t b mono" x="339" y="230" text-anchor="middle">delegate_task</text><text class="t s mut" x="339" y="250" text-anchor="middle">Entity A</text>
<rect class="ai bx" x="244" y="270" width="190" height="50" rx="9"/><text class="t b mono" x="339" y="290" text-anchor="middle">delegate_task</text><text class="t s mut" x="339" y="310" text-anchor="middle">Entity B</text>
<path class="ln" d="M434 265 L446 265 L446 140 L458 140" marker-end="url(#ah)"/>
<path class="ln lnd" d="M339 320 L339 370" marker-end="url(#ah)"/>
<rect class="ui bx" x="244" y="370" width="190" height="54" rx="9"/><text class="t b" x="339" y="392" text-anchor="middle">User sees</text><text class="t s mut" x="339" y="412" text-anchor="middle">Both run in parallel</text>
<text class="zonet" x="458" y="100" text-anchor="start">Round 3</text>
<rect class="ai bx" x="458" y="110" width="190" height="60" rx="9"/><text class="t b" x="553" y="135" text-anchor="middle">Model</text><text class="t s mut" x="553" y="155" text-anchor="middle">asks generate_document</text>
<path class="ln" d="M553 170 L553 210" marker-end="url(#ah)"/>
<rect class="warn bx" x="458" y="210" width="190" height="110" rx="9"/><text class="t b mono" x="553" y="260" text-anchor="middle">generate_document</text><text class="t s mut" x="553" y="280" text-anchor="middle">IC memo saved</text>
<path class="ln" d="M648 265 L660 265 L660 140 L672 140" marker-end="url(#ah)"/>
<path class="ln lnd" d="M553 320 L553 370" marker-end="url(#ah)"/>
<rect class="ui bx" x="458" y="370" width="190" height="54" rx="9"/><text class="t b" x="553" y="392" text-anchor="middle">User sees</text><text class="t s mut" x="553" y="412" text-anchor="middle">Download card</text>
<text class="zonet" x="672" y="100" text-anchor="start">Round 4</text>
<rect class="ai bx" x="672" y="110" width="190" height="60" rx="9"/><text class="t b" x="767" y="135" text-anchor="middle">Model</text><text class="t s mut" x="767" y="155" text-anchor="middle">marks steps done</text>
<path class="ln" d="M767 170 L767 210" marker-end="url(#ah)"/>
<rect class="code bx" x="672" y="210" width="190" height="110" rx="9"/><text class="t b mono" x="767" y="260" text-anchor="middle">update_plan</text><text class="t s mut" x="767" y="280" text-anchor="middle">4 / 4 done</text>
<path class="ln" d="M862 265 L874 265 L874 140 L886 140" marker-end="url(#ah)"/>
<path class="ln lnd" d="M767 320 L767 370" marker-end="url(#ah)"/>
<rect class="ui bx" x="672" y="370" width="190" height="54" rx="9"/><text class="t b" x="767" y="392" text-anchor="middle">User sees</text><text class="t s mut" x="767" y="412" text-anchor="middle">Checklist ticks off</text>
<text class="zonet" x="886" y="100" text-anchor="start">Answer</text>
<rect class="ai bx" x="886" y="110" width="190" height="60" rx="9"/><text class="t b" x="981" y="135" text-anchor="middle">Model</text><text class="t s mut" x="981" y="155" text-anchor="middle">writes 2 sentences</text>
<rect class="ui bx dash" x="886" y="210" width="190" height="110" rx="9"/><text class="t b" x="981" y="252" text-anchor="middle">no tool calls</text><text class="t s mut" x="981" y="272" text-anchor="middle">content_done</text><text class="t s mut" x="981" y="288" text-anchor="middle">→ END</text>
<path class="ln lnd" d="M981 320 L981 370" marker-end="url(#ah)"/>
<rect class="ui bx" x="886" y="370" width="190" height="54" rx="9"/><text class="t b" x="981" y="392" text-anchor="middle">User sees</text><text class="t s mut" x="981" y="412" text-anchor="middle">Short reply · [DONE]</text>
<text class="t s mut" x="30" y="470" text-anchor="start">Text the model writes in any round streams to the chat as it is written. The sub-agents in round 2 work silently;</text>
<text class="t s mut" x="30" y="490" text-anchor="start">only their summaries come back. If round 8 were reached, stopAtRoundLimit would end the turn instead.</text>
</svg>
