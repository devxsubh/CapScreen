<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">CapScreen - Desktop Architecture</title>
  <desc id="d">Electron desktop app running a Next.js UI, Express backend, SQLite, and Watchman sidecar locally, with optional cloud auth, sanctions list downloads, and cloud LLMs.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="o" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#d97706"/></marker>
    <style>
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}
      .h{font-size:14px;font-weight:700;fill:#0f172a}
      .s{font-size:11.5px;fill:#475569}
      .lbl{font-size:11px;fill:#64748b;font-style:italic}
    </style>
  </defs>
  <rect width="1200" height="740" fill="#f8fafc"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#0f172a">CapScreen — desktop architecture</text>
  <text x="30" y="58" class="s">Everything inside the green box runs on the user's machine. Only dashed arrows leave it.</text>

  <!-- desktop boundary -->
  <rect x="30" y="75" width="800" height="620" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="50" y="98" font-size="13" font-weight="700" fill="#15803d">YOUR MACHINE  ·  data in &lt;userData&gt; (never uploaded)</text>

  <!-- Electron main -->
  <rect x="60" y="115" width="740" height="70" rx="8" class="box"/>
  <text x="75" y="140" class="h">Electron main process</text>
  <text x="75" y="160" class="s">Boots sidecars on free loopback ports · sign-in gate · capscreen:// protocol adds the per-launch token</text>

  <!-- window + UI -->
  <rect x="60" y="225" width="360" height="70" rx="8" class="box"/>
  <text x="75" y="250" class="h">BrowserWindow</text>
  <text x="75" y="270" class="s">loads capscreen://app · preload bridge</text>
  <rect x="440" y="225" width="360" height="70" rx="8" class="box"/>
  <text x="455" y="250" class="h">UI — Next.js (standalone)</text>
  <text x="455" y="270" class="s">React 19 · Tailwind · React Flow ownership graph</text>

  <!-- backend -->
  <rect x="60" y="345" width="740" height="150" rx="8" class="box"/>
  <text x="75" y="370" class="h">Backend — Express (utilityProcess, 127.0.0.1)</text>
  <g class="s">
    <rect x="75" y="390" width="170" height="85" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="85" y="412" class="h" font-size="12.5">Screening pipeline</text>
    <text x="85" y="432">parse CSV → graph →</text><text x="85" y="448">Watchman → classify →</text><text x="85" y="464">narrative</text>
    <rect x="260" y="390" width="170" height="85" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="270" y="412" class="h" font-size="12.5">Agent chat + RAG</text>
    <text x="270" y="432">tool-use loop (SSE)</text><text x="270" y="448">local embeddings,</text><text x="270" y="464">in-process cosine</text>
    <rect x="445" y="390" width="170" height="85" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="455" y="412" class="h" font-size="12.5">AI Control Center</text>
    <text x="455" y="432">providers · model roles</text><text x="455" y="448">local-only policy</text><text x="455" y="464">AES-256-GCM keys</text>
    <rect x="630" y="390" width="155" height="85" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="640" y="412" class="h" font-size="12.5">Data services</text>
    <text x="640" y="432">backup / restore</text><text x="640" y="448">folder watch</text><text x="640" y="464">audit export</text>
  </g>

  <!-- bottom row -->
  <g>
    <rect x="60" y="560" width="140" height="90" rx="8" class="box"/>
    <text x="72" y="585" class="h">SQLite</text><text x="72" y="605" class="s">capscreen.db</text><text x="72" y="621" class="s">mongoose via</text><text x="72" y="637" class="s">node:sqlite</text>
    <rect x="210" y="560" width="140" height="90" rx="8" class="box"/>
    <text x="222" y="585" class="h">Local files</text><text x="222" y="605" class="s">&lt;userData&gt;/files</text><text x="222" y="621" class="s">CSVs, documents</text>
    <rect x="360" y="560" width="140" height="90" rx="8" class="box"/>
    <text x="372" y="585" class="h">OS keychain</text><text x="372" y="605" class="s">safeStorage master</text><text x="372" y="621" class="s">key + session</text>
    <rect x="510" y="560" width="140" height="90" rx="8" class="box"/>
    <text x="522" y="585" class="h">Local LLM</text><text x="522" y="605" class="s">Ollama /</text><text x="522" y="621" class="s">LM Studio /</text><text x="522" y="637" class="s">llama.cpp</text>
    <rect x="660" y="560" width="140" height="90" rx="8" class="box"/>
    <text x="672" y="585" class="h">Watchman</text><text x="672" y="605" class="s">Go sidecar, no</text><text x="672" y="621" class="s">libpostal · OFAC</text><text x="672" y="637" class="s">+ EU lists</text>
  </g>

  <!-- internal arrows -->
  <g stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M240,185 V225"/>
    <path d="M420,260 H440"/>
    <path d="M620,295 V345"/>
    <path d="M130,495 V560"/>
    <path d="M280,495 V560"/>
    <path d="M430,495 V560"/>
    <path d="M580,495 V560"/>
    <path d="M730,495 V560"/>
  </g>
  <text x="628" y="325" class="lbl">/__api/* + token</text>

  <!-- cloud column -->
  <text x="880" y="98" font-size="13" font-weight="700" fill="#b45309">OUTSIDE (optional / minimal)</text>
  <rect x="880" y="115" width="290" height="125" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="895" y="140" class="h">Auth service</text>
  <text x="895" y="160" class="s">Vercel + MongoDB Atlas</text>
  <text x="895" y="180" class="s">signup · sign-in · verify · reset</text>
  <text x="895" y="196" class="s">hosted portal, RFC 8252 + PKCE</text>
  <text x="895" y="218" class="s" font-weight="700">Accounts only — no screening data</text>

  <rect x="880" y="290" width="290" height="110" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="895" y="315" class="h">Cloud LLMs (BYO key)</text>
  <text x="895" y="335" class="s">Anthropic · OpenAI · Gemini ·</text>
  <text x="895" y="351" class="s">OpenRouter · Groq · custom</text>
  <text x="895" y="375" class="s" font-weight="700">Only if the user assigns a cloud model</text>

  <rect x="880" y="450" width="290" height="110" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="895" y="475" class="h">Public sanctions lists</text>
  <text x="895" y="495" class="s">OFAC SDN · EU Consolidated</text>
  <text x="895" y="511" class="s">downloaded every 12 h (or imported offline)</text>
  <text x="895" y="535" class="s" font-weight="700">Inbound only — nothing uploaded</text>

  <!-- external arrows (dashed) -->
  <g stroke="#d97706" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#o)">
    <path d="M800,150 H880"/>
    <path d="M800,415 H840 V345 H880"/>
    <path d="M800,605 H840 V505 H880"/>
  </g>
  <text x="808" y="143" class="lbl" fill="#b45309" style="fill:#b45309">sign-in</text>

  <!-- legend -->
  <rect x="880" y="610" width="290" height="85" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <line x1="895" y1="634" x2="935" y2="634" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="945" y="638" class="s">local, loopback only</text>
  <line x1="895" y1="658" x2="935" y2="658" stroke="#d97706" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#o)"/>
  <text x="945" y="662" class="s">leaves the machine</text>
  <text x="895" y="684" class="s">Screening fails closed if Watchman is down.</text>
</svg>
